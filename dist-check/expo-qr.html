<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expo Go QR — expense-tracker</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0b0b0f; color:#eee;
         display:flex; flex-direction:column; align-items:center; gap:16px; padding:40px; }
  #qr { background:#fff; padding:24px; border-radius:16px; }
  code { background:#1c1c22; padding:6px 10px; border-radius:8px; font-size:16px; }
  p { opacity:.75; max-width:520px; text-align:center; line-height:1.5; }
</style>
</head>
<body>
  <h1>Scan with Expo Go</h1>
  <div id="qr"></div>
  <p>Open the <b>Expo Go</b> app on your phone → tap <b>Scan QR code</b> → point at this image.</p>
  <code>exp://192.168.29.116:8081</code>
  <p>Phone and PC must be on the <b>same Wi‑Fi network</b>.</p>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qr"), {
      text: "exp://192.168.29.116:8081",
      width: 320, height: 320,
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
